framework:
    secret: '%env(APP_SECRET)%'
    
    session:
        # Indispensable pour que la session survive au proxy de Render
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        storage_factory_id: session.storage.factory.native

    php_errors:
        log: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file